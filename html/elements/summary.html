<!-- The <body> element defines an HTML document's "body" and it's where any content that we want to display to the user will be held: -->

<body>
  <!-- <h1> = heading element and <p> = paragraph element -->
  <h1>Heading level 1</h1>
  <h2>Heading level 2</h2>
  <h3>Heading level 3</h3>
  <h4>Heading level 4</h4>
  <h5>Heading level 5</h5>
  <h6>Heading level 6</h6>
  <p>Paragraph</p>

  
  <b></b> or <bold></bold> <!-- element to bold text. -->
  <i></i> <!-- element to italicize text. -->
  <u></u> <!-- element to underline text. -->
  <s></s> <!-- element to strikethrough text. -->

<!-- lists -->
<!-- For unordered lists, also known as bullet points, start with the <ul> tag and wrap each item in a <li> list item element. Like so: -->
<ul> <!-- Unordered lists -->
  <li></li>
</ul>
<!-- For ordered lists, also known as numbered lists, we use the <ol> element: -->
<ol> <!-- Ordered lists -->
  <li></li>
</ol>

<!-- We can use the <a> anchor element! This link tag allows us to add a hyperlink to a piece of text. -->
<a href="link">O que aparece digitado</a>
<!-- Note: This can also be used to point to an email or phone number using a mailto:, tel:, or sms: parameter: -->
<a href="mailto:mariana@gmail.com">O que aparece digitado</a>
<a href="tel:0000-0000-0000">O que aparece digitado</a>
<a href="sms:833-935-5076">O que aparece digitado</a>

<!-- We can use a similar format, but with the <img> image element. -->
<img src="link.png,jpg...">
  
<!--The <br> break tag adds a line break: -->
<br>
  
</body>
